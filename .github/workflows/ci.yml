name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: tests/test_provenance.py::test_committed_freeze_names_a_real_commit
      # runs `git cat-file -e <frozen-commit>^{commit}` against the real freeze
      # manifest. The default fetch-depth:1 is a shallow clone that only contains
      # the tip, so that ancestor is genuinely absent and the test fails with
      # "not a valid object name" even though the commit exists upstream.
      # scheduled-paper.yml already uses fetch-depth:0 for the same reason.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install pytest ruff mypy pytest-cov pyyaml
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Tests + coverage gate
        run: pytest --junitxml=pytest-results.xml --cov=bot --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7
      - name: README headline block derives from canonical run
        run: python scripts/derive_canonical_readme.py --check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: Build image and run the in-container quality gate
        run: docker build -t trading-bot .
