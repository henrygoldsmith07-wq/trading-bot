name: Scheduled paper run

# Runs the prospective forward test daily ON THE FROZEN CODE.
#
# Threat model: freeze.json pins configuration AND a code fingerprint, so a
# naive checkout of main would execute whatever main contains today. Editing
# strategy.py after freezing would silently change the experiment while the
# manifest kept claiming otherwise.
#
# Why this workflow uses a separate git worktree:
# The runner previously executed the frozen commit in the SAME tree and then
# returned with "git checkout -B main origin/main". By then the forward step
# had rewritten forward_log.jsonl, freeze.json and universe_log.jsonl, so git
# refused the checkout ("local changes would be overwritten by checkout") and
# the run died AFTER computing a valid paper day. That day was lost. The
# failure is reproduced as
# tests/test_forward_evidence.py::test_legacy_checkout_B_fails_on_dirty_evidence_tree
# so the root cause stays documented.
#
# Now the frozen commit gets its own worktree, so main is never dirtied by the
# forward run and returning to main cannot fail. Evidence is copied out
# explicitly to a staging directory and merged by bot/forward_evidence.py,
# which is unit-tested, date-keyed, idempotent and fail-closed.
#
# Invariants this layout is built to keep:
#   * frozen code executes in an isolated tree;
#   * main owns the freeze pointer and the persistent evidence files;
#   * evidence is transferred explicitly, never by dirtying main;
#   * a concurrent commit on main cannot be overwritten. Each push attempt
#     re-bases on the newest origin/main and re-merges, and existing rows are
#     immutable, so a racing run can delay evidence but never lose or replace it;
#   * the freeze identity is rechecked before anything is committed;
#   * a duplicate date can never be appended;
#   * a computed paper day is never silently discarded. It is staged before any
#     git operation and uploaded as an artifact regardless of the outcome.
#
# Paper only. No real orders exist anywhere in this repo.

on:
  schedule:
    # Migration-safe dual schedule. Legacy frozen code keeps the 21:45 UTC
    # weekday run. New frozen code supports an explicit session date and runs
    # at 00:30 UTC every day, accounting the prior calendar session after the
    # UTC crypto day is closed. Weekend US-ETF sleeves remain flat/pending while
    # crypto is marked normally, so the return tape keeps true daily cadence.
    # The resolver below selects exactly one cadence from the frozen CLI.
    - cron: "45 21 * * 1-5"
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-run
  cancel-in-progress: false

# FROZEN_TREE / STAGING are deliberately NOT declared at this level.
#
# The `runner` context is unavailable in the workflow-level `env:` key: GitHub's
# context-availability table permits only `github`, `secrets`, `inputs` and
# `vars` there. Writing `${{ runner.temp }}` at this level makes the entire
# workflow file invalid, which GitHub reports as a zero-job "workflow file
# issue" failure rather than a normal job failure.
#
# The symptom is silent for a schedule-only workflow like this one: every push
# spawns a 0s failed run, and no scheduled run ever produces a forward day
# again. That is exactly what happened here -- the tape stopped advancing.
#
# They are declared per-step instead, where `runner` IS permitted:
#   jobs.<job_id>.steps.env               -> runner allowed
#   jobs.<job_id>.steps.working-directory -> runner allowed
#   jobs.<job_id>.steps.with              -> runner allowed
#
# Do not hoist these back up to this level; tests/test_workflow_hygiene.py
# fails if anyone does.

jobs:
  forward-step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ---- step 1: main, clean, full history (pointer and evidence owner) ---
      - name: Check out main (pointer and evidence owner)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read freeze pointer
        id: pointer
        run: python scripts/freeze_pointer.py

      - name: Stop gracefully when no freeze exists yet
        if: steps.pointer.outputs.commit == ''
        run: echo "::notice::no freeze manifest - nothing to advance today"

      # ---- step 2: build the ISOLATED frozen tree -------------------------
      - name: Create isolated worktree at the frozen commit
        if: steps.pointer.outputs.commit != ''
        env:
          FROZEN_TREE: ${{ runner.temp }}/frozen
          STAGING: ${{ runner.temp }}/staging
        run: |
          set -euo pipefail
          rm -rf "$FROZEN_TREE" "$STAGING"
          mkdir -p "$STAGING"
          # --detach: we want the frozen CODE, not a branch we might ever push.
          # This step removes the dirty-tree failure outright: the forward run
          # happens in this directory, so main is never modified and can always
          # be re-checked out.
          git worktree add --detach "$FROZEN_TREE" "${{ steps.pointer.outputs.commit }}"
          # The manifest and the tape live on main. The frozen commit predates
          # the current manifest and carries a STALE snapshot of the tape, so
          # seed both explicitly rather than trusting the frozen tree.
          cp freeze.json "$FROZEN_TREE/freeze.json"
          cp forward_log.jsonl "$FROZEN_TREE/forward_log.jsonl" 2>/dev/null || :

      - name: Cache market data
        if: steps.pointer.outputs.commit != ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/frozen/.cache
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      # ---- step 3: prove we are running the frozen implementation ----------
      - name: Verify running code matches the freeze
        if: steps.pointer.outputs.commit != ''
        working-directory: ${{ runner.temp }}/frozen
        run: python -m bot verify-freeze --freeze-file freeze.json

      - name: Resolve the market session date
        if: steps.pointer.outputs.commit != ''
        id: session
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          NEW_SCHEDULE='30 0 * * *'
          LEGACY_SCHEDULE='45 21 * * 1-5'

          if python -m bot forward --help | grep -q -- '--as-of-date'; then
            if [ "$EVENT_NAME" = 'schedule' ] && [ "$EVENT_SCHEDULE" != "$NEW_SCHEDULE" ]; then
              echo "trading=false" >> "$GITHUB_OUTPUT"
              echo "::notice::explicit-session runner waits for the 00:30 UTC schedule"
              exit 0
            fi
            TARGET_DATE=$(date -u -d 'yesterday' +%F)
            echo "trading=true" >> "$GITHUB_OUTPUT"
            echo "mode=explicit" >> "$GITHUB_OUTPUT"
            echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
            echo "::notice::accounting fully closed session $TARGET_DATE"
          else
            if [ "$EVENT_NAME" = 'schedule' ] && [ "$EVENT_SCHEDULE" != "$LEGACY_SCHEDULE" ]; then
              echo "trading=false" >> "$GITHUB_OUTPUT"
              echo "::notice::legacy frozen runner remains on its 21:45 UTC schedule"
              exit 0
            fi
            echo "trading=true" >> "$GITHUB_OUTPUT"
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi

      # ---- step 4: one forward day on frozen code, in isolation -----------
      - name: Advance the prospective paper portfolio one day
        if: steps.pointer.outputs.commit != '' && steps.session.outputs.trading == 'true'
        working-directory: ${{ runner.temp }}/frozen
        env:
          LOG_FILE: forward_log.jsonl
        run: |
          set -euo pipefail
          if [ '${{ steps.session.outputs.mode }}' = 'explicit' ]; then
            python -m bot forward --step --as-of-date '${{ steps.session.outputs.date }}' --freeze-file freeze.json --log-file "$LOG_FILE"
          else
            python -m bot forward --step --freeze-file freeze.json --log-file "$LOG_FILE"
          fi
          python -m bot forward --report --freeze-file freeze.json --log-file "$LOG_FILE"

      # ---- step 4b: record today's universe (point-in-time dataset) -------
      # Today's ranking recorded TODAY carries no survivorship bias. A year of
      # these snapshots is the dataset future backtests deserve.
      #
      # continue-on-error is load-bearing, not laziness: this step is a data
      # collection nicety, and without the flag a snapshot failure would skip
      # the staging step and discard the forward day step 4 already computed.
      - name: Snapshot today's universe
        if: steps.pointer.outputs.commit != '' && steps.session.outputs.trading == 'true'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/frozen
        run: python -m bot universe-snapshot --top 20 --log universe_log.jsonl

      # ---- step 5: STAGE the evidence before touching git ------------------
      # Everything the run produced is copied out of the worktree and recorded
      # with the freeze identity that produced it. From here the day is durable:
      # any later failure is recoverable from $STAGING.
      - name: Stage evidence for transfer to main
        if: steps.pointer.outputs.commit != '' && steps.session.outputs.trading == 'true'
        env:
          FROZEN_TREE: ${{ runner.temp }}/frozen
          STAGING: ${{ runner.temp }}/staging
        run: |
          set -euo pipefail
          for f in forward_log.jsonl universe_log.jsonl cost_observations.jsonl; do
            if [ -f "$FROZEN_TREE/$f" ]; then cp "$FROZEN_TREE/$f" "$STAGING/$f"; fi
          done
          if [ ! -f "$STAGING/forward_log.jsonl" ]; then
            echo "::error::the forward step produced no forward_log.jsonl; refusing to stage an empty transfer"
            exit 1
          fi
          # Record which freeze produced this evidence. The merge refuses to
          # attach it if main's active freeze is no longer this one.
          python - "$STAGING/evidence_staging.json" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path("freeze.json").read_text(encoding="utf-8"))
          identity = {
              "git_commit_at_freeze": manifest.get("git_commit_at_freeze"),
              "code_sha256": manifest.get("code_sha256"),
              "config_sha256": manifest.get("config_sha256"),
              "frozen_at_date": manifest.get("frozen_at_date"),
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps({"produced_under_freeze": identity}, indent=2) + "\n", encoding="utf-8"
          )
          print("staged evidence for freeze", identity["git_commit_at_freeze"])
          PY

      # ---- step 6: merge into main and push, safely retrying --------------
      # Main is clean here because the forward run never touched it, so
      # re-checking out origin/main cannot fail. Each attempt re-bases on the
      # newest main and re-merges the staged evidence, so a concurrent commit is
      # never overwritten and never costs us the day. The merge is date-keyed
      # and idempotent, so retrying converges instead of duplicating.
      - name: Merge staged evidence into main and push
        if: steps.pointer.outputs.commit != '' && steps.session.outputs.trading == 'true'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          # Required here: the run script reads $STAGING under `set -u`, so an
          # undeclared value aborts the merge with "unbound variable" rather
          # than silently merging from an empty path.
          STAGING: ${{ runner.temp }}/staging
        run: |
          set -euo pipefail
          git config user.name "paper-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            python -m bot forward-evidence merge --staging "$STAGING" --repo .
            git add -- forward_log.jsonl universe_log.jsonl
            if [ -f cost_observations.jsonl ]; then git add -- cost_observations.jsonl; fi
            if git diff --cached --quiet; then
              echo "no new evidence to commit (already present on $BRANCH)"
              exit 0
            fi
            LAST=$(tail -n 1 forward_log.jsonl | python -c 'import json,sys;print(json.load(sys.stdin)["date"])' 2>/dev/null || echo unknown)
            git commit -q -m "paper forward log: $LAST"
            if git push -q origin "$BRANCH"; then
              echo "pushed forward evidence for $LAST on attempt $attempt"
              exit 0
            fi
            echo "::notice::push rejected on attempt $attempt (main moved); re-merging onto the new tip"
          done
          echo "::error::could not land forward evidence after 5 attempts; it is preserved in the artifact"
          exit 1

      - name: Remove the frozen worktree
        if: always()
        env:
          FROZEN_TREE: ${{ runner.temp }}/frozen
        run: git worktree remove --force "$FROZEN_TREE" 2>/dev/null || rm -rf "$FROZEN_TREE"

      # ---- step 7: never lose a computed day ------------------------------
      # if: always(), and the STAGING directory is what gets uploaded. Even if
      # the merge, the push or the runner itself failed, the evidence that was
      # computed is recoverable from here.
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forward-state-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/staging/
            reports/
          if-no-files-found: ignore
