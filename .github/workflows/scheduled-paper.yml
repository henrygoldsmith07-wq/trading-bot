name: Scheduled paper run

# Runs the prospective forward test daily ON THE FROZEN CODE.
#
# Threat model (why the dance below): freeze.json pins configuration AND a
# code fingerprint, but a naive `actions/checkout` would execute whatever is
# on main today — so editing strategy.py after freezing would silently change
# the experiment while the manifest kept claiming otherwise. The workflow
# therefore:
#   1. reads the pointer fields from freeze.json on main,
#   2. checks out git_commit_at_freeze (the frozen implementation),
#   3. refuses to run unless the running source's sha256 matches the
#      manifest's code_sha256 (`python -m bot verify-freeze`),
#   4. trades one forward day from the frozen config only,
#   5. appends the log entry to main — data flows back, code never.
#
# Paper only — no real orders exist anywhere in this repo.

on:
  schedule:
    # 21:45 UTC — AFTER the NYSE close (16:00 ET = 20:00/21:00 UTC depending
    # on DST). The portfolio mixes 24/7 crypto with US ETFs; running here means
    # every asset's daily bar contains its ACTUAL open and close, so next_open
    # execution in the forward test matches the backtest exactly. Crypto's
    # post-close tail is handled by mark-chained accounting.
    - cron: "45 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-run
  cancel-in-progress: false

jobs:
  forward-step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ---- step 1: read the freeze pointer from main -----------------------
      - name: Check out default branch (pointer only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Read freeze pointer
        id: pointer
        run: |
          python scripts/freeze_pointer.py
          # carry the manifest across the upcoming ref checkout: freeze.json
          # lives on main, but the frozen commit predates it
          cp freeze.json /tmp/freeze.json
          # ...and carry the TAPE too. Step 4 runs inside the frozen commit's
          # tree, whose forward_log.jsonl is a snapshot from freeze time and
          # therefore STALE: entries main has deliberately quarantined (every
          # day predating a re-freeze) are still sitting in it. Appending to
          # that file and merging back resurrected two pre-freeze days, which
          # then counted as forward evidence. The tape lives on main; the
          # frozen commit contributes code, never data.
          cp forward_log.jsonl /tmp/forward_log.jsonl 2>/dev/null || :

      - name: Stop gracefully when no freeze exists yet
        if: steps.pointer.outputs.commit == ''
        run: echo "::notice::no freeze manifest — nothing to advance today"

      # The portfolio mixes 24/7 crypto with three US ETFs. On a Saturday or
      # Sunday the ETF sleeves are structurally 'session_pending' — there is
      # no session to observe — so the day can never be fully observed. The
      # runner would still record it: a return computed from the 10 crypto
      # sleeves only, carrying a 13-asset label, booked as a forward day and
      # counted as a data outage. Two days in seven is ~29% of scheduled days,
      # which sits above the 20% outage threshold and would hold the verdict
      # grade down permanently — an exchange being closed is not a broken
      # feed. Do not trade on days the equity sleeves cannot trade.
      # (NYSE holidays are not knowable here; api/summary.py classifies those
      # as market-closed rather than outage when they do occur.)
      - name: Skip days the equity sleeves cannot trade
        id: calendar
        run: |
          dow=$(date -u +%u)  # 1=Monday .. 7=Sunday
          if [ "$dow" -ge 6 ]; then
            echo "trading=false" >> "$GITHUB_OUTPUT"
            echo "::notice::weekend ($(date -u +%A)) — equity sessions closed, no forward day recorded"
          else
            echo "trading=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- step 2: become the frozen commit --------------------------------
      - name: Check out the frozen commit
        if: steps.pointer.outputs.commit != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pointer.outputs.commit }}
          fetch-depth: 0

      - name: Restore the manifest and the tape into the frozen tree
        if: steps.pointer.outputs.commit != ''
        run: |
          cp /tmp/freeze.json freeze.json
          # seed the tape from main so --step appends to the CURRENT record
          # rather than to the stale snapshot baked into the frozen commit
          cp /tmp/forward_log.jsonl forward_log.jsonl 2>/dev/null || :

      - uses: actions/setup-python@v7
        if: steps.pointer.outputs.commit != ''
        with:
          python-version: "3.12"

      - name: Cache market data
        if: steps.pointer.outputs.code_sha256 != ''
        uses: actions/cache@v6
        with:
          path: .cache
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      # ---- step 3: prove we are running the frozen implementation ----------
      - name: Verify running code matches the freeze
        if: steps.pointer.outputs.commit != ''
        run: python -m bot verify-freeze --freeze-file freeze.json

      # ---- step 4: one forward day on frozen code --------------------------
      - name: Advance the prospective paper portfolio one day
        if: steps.pointer.outputs.commit != '' && steps.calendar.outputs.trading == 'true'
        env:
          LOG_FILE: forward_log.jsonl
        run: |
          python -m bot forward --step --freeze-file freeze.json --log-file "$LOG_FILE"
          python -m bot forward --report --freeze-file freeze.json --log-file "$LOG_FILE"

      # ---- step 4b: record today's universe (point-in-time dataset) -------
      # Today's ranking recorded TODAY carries no survivorship bias; a year
      # of these snapshots is the dataset future backtests deserve.
      #
      # continue-on-error is load-bearing, not laziness. This step is a data
      # collection nicety; without the flag, a snapshot failure skips step 5
      # and the forward day step 4 already computed is silently discarded.
      # That is exactly how five consecutive runs produced one recorded day.
      # The forward log is the evidence — nothing auxiliary may hold it hostage.
      - name: Snapshot today's universe
        if: steps.pointer.outputs.commit != '' && steps.calendar.outputs.trading == 'true'
        continue-on-error: true
        run: python -m bot universe-snapshot --top 20 --log universe_log.jsonl

      # ---- step 5: return to main; append ONLY the log (data, not code) ----
      - name: Append forward log to main
        if: steps.pointer.outputs.commit != '' && steps.calendar.outputs.trading == 'true'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ -f forward_log.jsonl ] || { echo "no log produced this run"; exit 0; }
          cp forward_log.jsonl /tmp/forward_log.jsonl
          [ -f universe_log.jsonl ] && cp universe_log.jsonl /tmp/universe_log.jsonl
          [ -f cost_observations.jsonl ] && cp cost_observations.jsonl /tmp/cost_observations.jsonl
          git config user.name "paper-bot"
          git config user.email "actions@users.noreply.github.com"
          # Main may have advanced while the frozen step was running. Refresh
          # before merging data so the bot never tries to push from a stale
          # branch snapshot.
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          # A re-freeze during this workflow changes the experiment identity.
          # Never attach evidence produced by the old frozen code to the new
          # freeze merely because both runs happened on the same calendar day.
          CURRENT_FREEZE=$(python -c "import json; print(json.load(open('freeze.json')).get('git_commit_at_freeze', ''))")
          if [ "$CURRENT_FREEZE" != "${{ steps.pointer.outputs.commit }}" ]; then
            echo "::notice::freeze changed while this run was executing; preserving artifacts but not mutating main"
            exit 0
          fi

          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('forward_log.jsonl')
          new = [json.loads(l) for l in pathlib.Path('/tmp/forward_log.jsonl').read_text().splitlines() if l.strip()]
          old = []
          if p.exists():
              old = [json.loads(l) for l in p.read_text().splitlines() if l.strip()]
          seen = {e.get('date') for e in old}
          merged = old + [e for e in new if e.get('date') not in seen]
          # Nothing downstream filters the tape by freeze date, so a day that
          # predates the current freeze would be read as forward evidence.
          # That is the one mistake this log cannot survive: it would mean
          # scoring the experiment on data from before the rule was sealed.
          # Enforce the boundary here, on every run, not by hand once.
          fpath = pathlib.Path('freeze.json')
          if fpath.exists():
              cutoff = json.loads(fpath.read_text()).get('frozen_at_date')
              if cutoff:
                  kept = [e for e in merged if (e.get('date') or '') > cutoff]
                  dropped = len(merged) - len(kept)
                  if dropped:
                      print(f"dropped {dropped} entr{'y' if dropped == 1 else 'ies'} "
                            f"dated on/before the freeze ({cutoff})")
                  merged = kept
          p.write_text(''.join(json.dumps(e) + '\n' for e in merged))
          print(f"forward log entries after merge: {len(merged)}")
          u = pathlib.Path('universe_log.jsonl')
          if pathlib.Path('/tmp/universe_log.jsonl').exists():
              uold = {}
              if u.exists():
                  for line in u.read_text().splitlines():
                      if line.strip():
                          e = json.loads(line); uold[e['date']] = line
              for line in pathlib.Path('/tmp/universe_log.jsonl').read_text().splitlines():
                  if line.strip():
                      e = json.loads(line)
                      if e['date'] not in uold:
                          uold[e['date']] = line
              u.write_text(''.join(uold[d] + '\n' for d in sorted(uold)))
              print(f"universe snapshot days: {len(uold)}")
          cpath = pathlib.Path('cost_observations.jsonl')
          if pathlib.Path('/tmp/cost_observations.jsonl').exists():
              existing = set()
              if cpath.exists():
                  existing = set(cpath.read_text().splitlines())
              newlines = [line for line in pathlib.Path('/tmp/cost_observations.jsonl').read_text().splitlines()
                          if line.strip() and line not in existing]
              with cpath.open('a', encoding='utf-8') as f:
                  f.writelines(line + '\n' for line in newlines)
              print(f"cost observations appended: {len(newlines)}")
          PY
          git add forward_log.jsonl universe_log.jsonl cost_observations.jsonl
          if git diff --cached --quiet; then
            echo "no new entries"
          else
            LAST=$(tail -n 1 forward_log.jsonl | python -c "import json,sys;print(json.load(sys.stdin)['date'])")
            git commit -m "paper forward log: $LAST"
            git push origin "$BRANCH"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forward-state-${{ github.run_id }}
          path: |
            forward_log.jsonl
            reports/
          if-no-files-found: ignore
