name: Diagnose Binance mirrors

# Temporary probe. Establishes, from a real GitHub Actions runner, which
# Binance endpoints are reachable — the scheduled forward step runs FROZEN
# code with a single hard-coded klines host, so before re-freezing we need to
# know whether the mirror list actually solves the 451.
#
# The block is per-endpoint: /api/v3/ticker/24hr was served from a runner on
# the same night /api/v3/klines was refused, so "Binance is blocked" is not
# one question. Delete this file once the answer is recorded.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe every mirror
        run: |
          python - <<'PY'
          import sys, urllib.request, urllib.error

          sys.path.insert(0, '.')
          from bot.data import BINANCE_KLINES_URLS, fetch_candles, fetch_daily_history
          from bot.universe import TICKER_URLS


          def probe(url, width=34):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return f"{r.status} ok ({len(r.read())} bytes)".ljust(width)
              except urllib.error.HTTPError as e:
                  return f"{e.code} {e.reason}".ljust(width)
              except Exception as e:
                  return f"{type(e).__name__}: {e}".ljust(width)


          print("--- /api/v3/klines  (forward evidence: 10 of 13 sleeves) ---")
          for u in BINANCE_KLINES_URLS:
              print(f"  {probe(u + '?symbol=BTCUSDT&interval=1d&limit=5')} {u}")

          print("--- /api/v3/ticker/24hr  (universe snapshot) ---")
          for u in TICKER_URLS:
              print(f"  {probe(u)} {u}")

          print("--- the real code path, on this runner ---")
          for name, fn in (
              ("fetch_candles", lambda: fetch_candles("BTCUSDT", interval="1d", limit=5)),
              ("fetch_daily_history", lambda: fetch_daily_history("BTCUSDT", max_candles=1000)),
          ):
              try:
                  rows = fn()
                  print(f"  {name}: OK, {len(rows)} candles, last close {rows[-1]['close']}")
              except Exception as e:
                  print(f"  {name}: FAILED {type(e).__name__}: {e}")
          PY
